<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lektionen Trainer — Выбор уровня</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    html, body { height: 100%; }
    body { background: #0f172a; color: #f8fafc; }
    .selector-container {
      width: 100%; max-width: 720px; height: 100%; margin: 0 auto; text-align: center;
      display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 40px) 22px calc(env(safe-area-inset-bottom, 0px) + 28px);
    }
    .title { font-size: 1.7rem; font-weight: 600; margin-bottom: 32px; color: #f1f5f9; }
    .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr;
            grid-auto-rows: minmax(140px, 1fr); gap: 18px; }
    .option-card { background: #1e293b; border: 2px solid #334155; border-radius: 22px;
                   padding: 20px; transition: all .2s ease; user-select: none;
                   text-decoration: none; display: flex; flex-direction: column;
                   align-items: center; justify-content: center; }
    .option-card:hover, .option-card:active { border-color: #38bdf8; background: #243248;
                         box-shadow: 0 10px 25px -5px rgba(56,189,248,.25); }
    .option-card.soon { opacity: .45; pointer-events: none; }
    .option-title { font-size: 2.6rem; font-weight: 700; color: #38bdf8; margin-bottom: 10px; }
    .option-subtitle { font-size: .95rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="selector-container">
    <h1 class="title">Выбор уровня тренажера</h1>
    <div class="grid" id="levels-grid"></div>
  </div>

  <script src="js/levels.js"></script>
  <script>
    const grid = document.getElementById('levels-grid');
    Object.entries(window.LEVELS).forEach(([id, lv]) => {
      const a = document.createElement('a');
      a.className = 'option-card' + (lv.soon ? ' soon' : '');
      if (!lv.soon) a.href = `trainer.html?level=${id}`;
      a.innerHTML = `<div class="option-title">${lv.name}</div>
                     <div class="option-subtitle">${lv.soon ? 'Скоро' : 'Lektionen Trainer ' + lv.name}</div>`;
      grid.appendChild(a);
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
